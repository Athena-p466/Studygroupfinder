<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Study Group Finder</title>
</head>
<body>
<h1>Find a Study Group</h1>
<p><a th:href="@{/}">Home</a> | <a th:href="@{/groups/create}">Create a group</a></p>
<p th:if="${error}" th:text="${error}">Error</p>
<p th:if="${success}" th:text="${success}">Success</p>

<form method="GET" th:action="@{/groups}">
    <h2>Choose a course</h2>
    <div th:each="c : ${courses}">
        <label>
            <input type="radio" name="courseId" th:value="${c.id}"
                   th:checked="${c.id == selectedCourseId}"/>
            <span th:text="|${c.id} - ${c.title} (${c.instructor})|">Course</span>
        </label>
    </div>
    <button type="submit">Show groups</button>
    <a th:href="@{/groups}">Show all</a>
</form>

<h2>Study Group Details</h2>
<p th:if="${#lists.isEmpty(groups)}">No groups found.</p>
<div th:each="g : ${groups}">
    <h3 th:text="${g.title}">Title</h3>
    Course: <span th:text="${g.courseId}">Course</span><br/>
    Description: <span th:text="${g.description}">Description</span><br/>
    Location: <span th:text="${g.location}">Location</span><br/>
    Time: <span th:text="${g.meetingTime}">Time</span><br/>
    Members: <span th:text="|${memberCounts[g.id]} / ${g.capacity}|">0 / 4</span><br/>
    <form method="POST" th:action="@{/groups/{id}/join(id=${g.id})}"
          th:if="${memberCounts[g.id] < g.capacity}">
        <button type="submit">Join group</button>
    </form>
    <span th:if="${memberCounts[g.id] >= g.capacity}">Full</span>
    <a th:if="${editableIds.contains(g.id)}" th:href="@{/groups/{id}/edit(id=${g.id})}">Edit this group</a>
    <hr/>
</div>
</body>
</html>
